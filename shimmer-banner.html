<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#151515" />
    <title>Kompas.com Smart Banner - Shimmer CTA</title>
    <link rel="preload" as="image" href="Assets/MockupLogo.png" />
    <link rel="preload" as="image" href="Assets/MockupWP.png" />
    <link rel="preload" as="image" href="Assets/MockupPodcast.png" />
    <link rel="preload" as="image" href="Assets/MockupVideoBaru.png" />
    <link rel="stylesheet" href="shimmer-banner.css" />
  </head>
  <body>
    <main class="shimmer-preview">
      <section class="article-preview" aria-label="Pratinjau artikel Kompas.com">
        <div class="article-preview__notice">
          <span>Iklan - Scroll ke bawah untuk melanjutkan</span>
          <span aria-hidden="true">&times;</span>
        </div>
        <div class="article-preview__ad" aria-label="Advertisement"></div>

        <aside class="shimmer-smart-banner" aria-label="Unduh aplikasi Kompas.com">
          <div class="shimmer-smart-banner__surface">
            <div class="shimmer-smart-banner__visual-frame">
              <img
                class="shimmer-smart-banner__visual"
                src="Assets/MockupLogo.png"
                alt="Mockup aplikasi Kompas.com"
                width="52"
                height="65"
                data-shimmer-visual
              />
            </div>

            <div class="shimmer-smart-banner__content">
              <div class="shimmer-smart-banner__details">
                <div class="shimmer-smart-banner__message-viewport">
                  <p class="shimmer-smart-banner__title" data-shimmer-title>KOMPAS.com Official App</p>
                </div>
                <div class="shimmer-smart-banner__rating" aria-label="Penilaian 4.6">
                  <span class="shimmer-smart-banner__stars" aria-hidden="true">
                    <img src="Assets/figma-star.svg" alt="" width="12" height="12" />
                    <img src="Assets/figma-star.svg" alt="" width="12" height="12" />
                    <img src="Assets/figma-star.svg" alt="" width="12" height="12" />
                    <img src="Assets/figma-star.svg" alt="" width="12" height="12" />
                    <img src="Assets/figma-star-half.svg" alt="" width="12" height="12" />
                  </span>
                  <span>4.6</span>
                  <span class="shimmer-smart-banner__dot" aria-hidden="true"></span>
                  <span>Gratis</span>
                </div>
              </div>

              <button class="shimmer-smart-banner__install" type="button" aria-label="Instal aplikasi Kompas.com">
                <span>Instal</span>
              </button>
            </div>
          </div>
        </aside>
      </section>

      <header class="site-header">
        <div class="site-header__brand">KOMPAS<span>.com</span></div>
        <nav aria-label="Navigasi Travel">
          <a href="#travel">Travel</a>
          <a href="#berita">Travel News</a>
          <a href="#ide">Travel Ideas</a>
        </nav>
      </header>

      <section class="story-preview" id="travel" aria-label="Berita Travel">
        <p class="story-preview__label">Travel</p>
        <h1>Inspirasi perjalanan yang lebih dekat lewat aplikasi Kompas.com</h1>
        <div class="story-preview__image" aria-hidden="true"></div>
        <p>Ikuti berita pilihan, podcast, dan video dalam satu aplikasi.</p>
      </section>
    </main>

    <script src="shimmer-banner.js"></script>
  </body>
</html>
